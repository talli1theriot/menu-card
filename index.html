<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Potato Tornado - Menu Card</h1>

    <form id="menu-form">
        <label for="menu-input">Paste your menu as JSON</label>
        <textarea id="menu-input" rows="8">
            [
            {"name": "Curly Fries", "price": 4},
            {"name": "Wavy Fries", "price": 4},
            {"name": "Waffle Fries", "price": 4},
            {"name": "Butter Potater", "price": 5.50},
            {"name": "Old Fashioned", "price": 6.50},
            {"name": "Fiesta Tater", "price": 8.25},
            {"name": "Pizza Potato", "price": 8.25},
            {"name": "Cajun Tada", "price": 8.25}
            ]
        </textarea>
        <button type="submit">Show my Menu</button>
    </form>

    <p id="count"></p>
    <p id="menu-text"></p>

    <script src="script.js"></script>
</body>
</html>
